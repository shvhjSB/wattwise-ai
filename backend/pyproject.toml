[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wattwise"
version = "0.1.0"
description = "WattWise AI backend: API, data pipeline and ML for explainable energy-waste detection"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pandas>=3.0.6,<3.1",
    "numpy>=2.2,<3",
    "tzdata>=2025.2",
    "pyarrow>=26,<27",
    "holidays>=0.106,<0.107",
    "scikit-learn>=1.9.1,<1.10",
    "lightgbm>=4.7,<4.8",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.32,<0.1",
]

# Development-only tools (PEP 735). Not part of the published package. `uv sync` installs them.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",  # required by starlette.testclient (Starlette 1.x)
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs>=3.0.5,<3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wattwise"]

# Runtime and dev dependencies are locked for every platform in uv.lock (DECISIONS D010). The
# version range keeps local uv and CI (pinned in .github/workflows/ci.yml) on one lockfile format.
[tool.uv]
required-version = ">=0.12.24,<0.13"
# The build backend is not part of uv.lock; pin its whole environment so the editable build of
# this package is reproducible too. Update together with [build-system] requires.
build-constraint-dependencies = [
    "hatchling==1.32.4",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# scikit-learn ships no type information (no py.typed); its objects are typed as Any here.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
