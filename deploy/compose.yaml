name: wattwise-private

x-backend: &backend
  image: ${WATTWISE_API_IMAGE:?Set an immutable API image reference}
  environment:
    WATTWISE_ENVIRONMENT: production
    WATTWISE_SECRETS_DIR: /run/secrets
    WATTWISE_REGISTRY_ROOT: /state/models
    WATTWISE_EVALUATION_ROOT: /state/evaluation
    WATTWISE_MODEL_DATA_KIND: ${WATTWISE_MODEL_DATA_KIND:?Set observed or synthetic explicitly}
    WATTWISE_REQUEST_TIMEOUT_SECONDS: "60"
    WATTWISE_MAX_CONCURRENT_REQUESTS: "16"
  secrets:
    - source: database_url
      target: WATTWISE_DATABASE_URL
  volumes:
    - artifacts:/state:ro
  read_only: true
  tmpfs:
    - /tmp:size=268435456,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: ${WATTWISE_API_MEMORY:-2g}
  cpus: 2
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_USER: wattwise_admin
      POSTGRES_DB: wattwise
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_password, db_admin_password]
    configs:
      - source: database_init
        target: /docker-entrypoint-initdb.d/10-wattwise.sh
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    stop_grace_period: 60s
    mem_limit: ${WATTWISE_DB_MEMORY:-1g}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wattwise_admin -d wattwise"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    <<: *backend
    command: [python, -m, wattwise.operations, migrate]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  check:
    <<: *backend
    command: [python, -m, wattwise.operations, check, --model-version, "${WATTWISE_MODEL_VERSION:?Set the pinned model version}"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend
    init: true
    restart: unless-stopped
    stop_grace_period: 75s
    depends_on:
      check:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  frontend:
    image: ${WATTWISE_FRONTEND_IMAGE:?Set an immutable frontend image reference}
    ports:
      - "127.0.0.1:${WATTWISE_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=67108864,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

secrets:
  db_admin_password:
    file: ${WATTWISE_DB_ADMIN_PASSWORD_FILE:?Set the private database admin password file path}
  db_password:
    file: ${WATTWISE_DB_PASSWORD_FILE:?Set the private password file path}
  database_url:
    file: ${WATTWISE_DATABASE_URL_FILE:?Set the private database URL file path}

configs:
  database_init:
    file: ./init-db.sh

volumes:
  postgres-data:
    external: true
    name: ${WATTWISE_POSTGRES_VOLUME:?Set an existing PostgreSQL volume name}
  artifacts:
    external: true
    name: ${WATTWISE_ARTIFACT_VOLUME:?Set an existing release artifact volume name}
