# Continuous integration: every check a developer runs locally, on every push to main and
# every pull request. Design and pinning policy: docs/DECISIONS.md D010 and D011.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# Pull requests: a new push cancels the older run for the same PR.
# Everything else (main pushes, manual runs) gets a unique group per run, so no run on main is
# ever cancelled, including pending runs, which a shared group would replace.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # The database tests (T023, D045) run against a real PostgreSQL 18, pinned by digest. The
    # credentials belong to this throwaway container only; they protect nothing.
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_USER: wattwise
          POSTGRES_PASSWORD: wattwise-ci
          POSTGRES_DB: wattwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wattwise -d wattwise_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      WATTWISE_TEST_DATABASE_URL: postgresql+psycopg://wattwise:wattwise-ci@localhost:5432/wattwise_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Keep in step with [tool.uv] required-version in backend/pyproject.toml. The checksum is
          # the SHA-256 of uv-x86_64-unknown-linux-gnu.tar.gz for this exact version, from the
          # release's .sha256 asset. Update both together.
          version: '0.12.24'
          checksum: 'b4dfaef47d491a7296981f8374a4595f55dbf84e8937c8ecd2983574d8bb3da6'
          working-directory: backend
          enable-cache: true
          # Relative to working-directory, so this is backend/uv.lock.
          cache-dependency-glob: uv.lock

      - name: Install Python and locked dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked

      - name: Audit locked Python dependencies (runtime and development)
        run: |
          uv export --locked --no-emit-project --format requirements-txt --output-file /tmp/wattwise-audit.txt > /dev/null
          uv run --locked pip-audit --disable-pip --require-hashes -r /tmp/wattwise-audit.txt --progress-spinner off

      - name: Lint (ruff)
        run: uv run --locked ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run --locked ruff format --check .

      - name: Type check (mypy, strict)
        run: uv run --locked mypy

      - name: Test (pytest)
        run: uv run --locked pytest --junitxml=test-results/pytest.xml

      - name: Require the PostgreSQL pipeline test to run
        run: >-
          uv run --locked python -c
          "import xml.etree.ElementTree as ET;
          cases = [case for case in ET.parse('test-results/pytest.xml').iter('testcase')
          if case.get('name') == 'test_fixture_to_persisted_analysis_and_api'];
          assert len(cases) == 1, 'The pipeline integration test must be collected exactly once';
          assert not any(case.find(tag) is not None for case in cases
          for tag in ('skipped', 'failure', 'error')), 'The pipeline test must pass, not skip'"

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit frontend runtime dependencies (all severities)
        run: npm audit --omit=dev --audit-level=low

      - name: Audit all frontend dependencies (high and critical gate)
        run: npm audit --audit-level=high

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan Git history with redacted output
        run: >-
          docker run --rm --network none
          --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact=100 --no-banner --log-opts=--all

  browser:
    name: Containers and browser workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: wattwise-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Chromium and its system dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium

      - name: Build and start the synthetic Compose demo
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Verify the Nginx frontend and API demo
        working-directory: frontend
        run: node scripts/compose-smoke.mjs initial

      - name: Verify browser workflows through Nginx and the container API
        working-directory: frontend
        run: npm run test:e2e:compose

      - name: Recreate containers while preserving demo data
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 180

      - name: Verify model and review persistence after recreation
        working-directory: frontend
        run: node scripts/compose-smoke.mjs restored

      - name: Verify private deployment gates, persistence and backup restore
        working-directory: frontend
        run: npm run test:deployment

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove the disposable CI demo
        if: always()
        run: docker compose down --volumes --remove-orphans
